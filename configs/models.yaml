# Bảng giá để ước tính chi phí (ai_engine/generation/cost_estimator.py).
#
# Quy tắc:
# - Chỉ ghi giá lấy từ trang giá chính thức của provider, kèm ngày lấy (as_of). Giá đổi theo thời gian.
# - Model không có ở đây thì chi phí hiển thị là "không biết", KHÔNG phải 0.
# - Đơn vị: tiền cho mỗi 1 triệu token đầu vào (input) và đầu ra (output).
#
# Hiện chỉ có các model chạy cục bộ (chi phí API bằng 0; chưa tính điện và máy).
# Khi chọn LLM provider ở M4, thêm dòng giá thật của model đó.

prices:
  - provider: extractive
    model: top-passages
    input_per_million: 0
    output_per_million: 0
    currency: USD
    as_of: "2026-11-06"
  # Ollama chạy trên máy của mình: không trả phí API (điện và khấu hao máy không tính).
  - provider: ollama
    model: qwen2.5:3b
    input_per_million: 0
    output_per_million: 0
    currency: USD
    as_of: "2026-11-06"
  - provider: ollama
    model: gemma3:4b
    input_per_million: 0
    output_per_million: 0
    currency: USD
    as_of: "2026-11-06"
