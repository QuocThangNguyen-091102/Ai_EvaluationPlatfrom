[pytest]
pythonpath = . ..
testpaths = tests
markers =
    integration: cần PostgreSQL thật đang chạy (docker compose up -d db)
# Starlette 1.x khuyên TestClient dùng gói httpx2 nhưng vẫn hỗ trợ httpx (chỉ ảnh hưởng công cụ test, không ảnh hưởng
# ứng dụng). Quyết định 2026-11-06: giữ httpx 0.28.1, chỉ lọc ĐÚNG cảnh báo này. Xem lại khi nâng Starlette lên bản
# bỏ hẳn httpx (lúc đó test sẽ báo lỗi rõ ràng, không âm thầm hỏng).
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
